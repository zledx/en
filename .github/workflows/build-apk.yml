name: Build enNavigation APK

on:
  push:
    branches: [android-apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build launcher icon from website favicon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable
          curl -fL --retry 3 --retry-delay 2 "https://enabcd.cn/favicon.ico" -o /tmp/en-favicon.ico
          if command -v magick >/dev/null 2>&1; then
            magick /tmp/en-favicon.ico[0] -resize 512x512 -background none -gravity center -extent 512x512 app/src/main/res/drawable/app_icon.png
          elif command -v convert >/dev/null 2>&1; then
            convert /tmp/en-favicon.ico[0] -resize 512x512 -background none -gravity center -extent 512x512 app/src/main/res/drawable/app_icon.png
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            convert /tmp/en-favicon.ico[0] -resize 512x512 -background none -gravity center -extent 512x512 app/src/main/res/drawable/app_icon.png
          fi
          file app/src/main/res/drawable/app_icon.png

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk en-navigation-v1.6.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: en-navigation-apk-v1.6.0
          path: en-navigation-v1.6.0-debug.apk
          if-no-files-found: error
          retention-days: 30
